name: Update Volleyball Schedule

on:
  schedule:
    # Runs automatically every day at 03:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows you to run it manually from the UI

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper
      run: python scrape_schedule.py

    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add bahman4_schedule.ics
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update schedule" && git push)
